<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리집 재고">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f5f1">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>우리집 재고</title>
<style>
:root{--g:#2f7d5b;--g2:#e7f3ec;--bg:#f6f5f1;--card:#fff;--ink:#1f2a24;--mute:#7a847e;--line:#e6e4dd;--soft:#f0eee8;--red:#d64545;--redbg:#fdecec;--or:#d98012;--orbg:#fdf3e4}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR",sans-serif;color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;font-size:16px;color:var(--ink)}
[hidden]{display:none!important}
#main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 36px) 16px calc(env(safe-area-inset-bottom) + 90px)}
.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.title{font-size:26px;font-weight:800;letter-spacing:-.5px}
.date{font-size:13px;color:var(--mute);margin-top:2px}
.who{font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 11px;color:#4c5650;margin-top:4px}
.banner{background:var(--orbg);color:#8a560c;font-size:12.5px;border-radius:12px;padding:9px 12px;margin-bottom:12px;line-height:1.5}
.banner.err{background:var(--redbg);color:var(--red)}
.card{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:12px;border:1px solid var(--line)}
.ch{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px;margin-bottom:6px}
.ch small{font-weight:500;color:var(--mute);font-size:12px}
.it{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--soft);font-size:14.5px;width:100%;text-align:left}
.it:first-of-type{border-top:none}
.loc{font-size:11.5px;color:var(--mute);margin-left:6px}
.b{font-size:11.5px;font-weight:700;border-radius:20px;padding:3px 9px;white-space:nowrap}
.b.r{background:var(--redbg);color:var(--red)}.b.o{background:var(--orbg);color:var(--or)}.b.g{background:var(--g2);color:var(--g)}.b.m{background:#efeee9;color:var(--mute)}
.t-r{color:var(--red)}.t-o{color:var(--or)}.t-g{color:var(--g)}
.btn{display:block;width:100%;background:var(--g);color:#fff;border-radius:12px;text-align:center;padding:12px;font-weight:700;font-size:15px;margin-top:8px}
.btn.ghost{background:var(--g2);color:var(--g)}
.btn.line{background:transparent;color:var(--mute);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--red);border:1px solid #f1c9c9}
.btn.danger.armed{background:var(--red);color:#fff}
.empty-msg{color:var(--mute);font-size:13.5px;padding:6px 0 4px}
.feed{font-size:12.5px;color:var(--mute);line-height:1.9}
.feed b{color:var(--ink);font-weight:600}
.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;outline:none}
.search:focus{border-color:var(--g)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{font-size:13px;padding:6px 11px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:#4c5650}
.chip.on{background:var(--g);color:#fff;border-color:var(--g);font-weight:700}
.inv{background:var(--card);border-radius:14px;border:1px solid var(--line);padding:10px 12px;margin-bottom:7px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.inv.open{border-radius:14px 14px 0 0;margin-bottom:0}
.inv-main{flex:1;min-width:0;text-align:left}
.inv .n{font-size:15px;font-weight:600}
.inv .s{font-size:12px;color:var(--mute);margin-top:2px;line-height:1.45}
.cnt{font-size:11px;color:var(--g);font-weight:600;margin-left:4px}
.inv.empty{background:#fafaf8}.inv.empty .n{color:var(--mute)}
.step{display:flex;align-items:center;gap:6px;flex-shrink:0}
.step button{width:32px;height:32px;border-radius:10px;background:var(--g2);color:var(--g);font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center}
.step b{min-width:34px;text-align:center;font-size:14.5px}
.lv{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-shrink:0}
.lv button{padding:7px 9px;font-size:12px;color:var(--mute)}
.lv button.on{background:var(--g);color:#fff;font-weight:700}
.panel{background:#fbfbf9;border:1px solid var(--line);border-top:none;border-radius:0 0 14px 14px;padding:4px 12px 10px;margin-bottom:7px}
.bt{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.bt .step button{width:28px;height:28px;font-size:16px}
.links{display:flex;gap:8px;margin-top:8px}
.links button{flex:1;font-size:13px;padding:8px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:#4c5650}
.chk{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--soft);font-size:15px;width:100%;text-align:left}
.chk:first-of-type{border-top:none}
.box{width:23px;height:23px;border-radius:7px;border:2px solid #c9cec9;flex-shrink:0}
.why{font-size:11.5px;color:var(--mute);margin-left:auto;white-space:nowrap}
.x{color:#b6bcb7;font-size:18px;padding:0 4px}
.addrow{display:flex;gap:8px;margin-top:8px}
.addrow input{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none;min-width:0}
.addrow button{background:var(--g);color:#fff;border-radius:10px;padding:0 16px;font-weight:700}
.sec{font-size:13px;font-weight:700;color:var(--mute);margin:6px 0 8px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}
.gi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 2px;text-align:center;font-size:13.5px;font-weight:600}
.gi small{display:block;font-size:10.5px;color:var(--mute);font-weight:400;margin-top:2px}
.gi.has{border-color:#bfdccb}
.tip{font-size:12.5px;color:var(--mute);line-height:1.6;margin-top:6px}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:7px 0 calc(env(safe-area-inset-bottom) + 6px);z-index:10}
.tab{font-size:11px;color:#9aa39d;text-align:center;width:72px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--g);font-weight:700}
.badge{position:absolute;top:-3px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 5px;min-width:17px}
/* sheet */
#sheet-wrap{position:fixed;inset:0;z-index:20}
.dim{position:absolute;inset:0;background:rgba(20,30,25,.32)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#fff;border-radius:22px 22px 0 0;padding:12px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:88vh;overflow-y:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:#d8dcd8;margin:0 auto 12px}
.sh-t{font-weight:800;font-size:18px;margin-bottom:14px}
.f{margin-bottom:13px}
.f>label{display:block;font-size:12.5px;color:var(--mute);margin-bottom:6px}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;background:#fff;-webkit-appearance:none;appearance:none;min-height:44px}
.inp:focus{border-color:var(--g)}
.hint{font-size:12px;color:var(--g);margin-top:5px}
.quick{display:flex;gap:6px;margin-top:7px}
.quick button{font-size:12.5px;padding:5px 10px;border-radius:16px;background:var(--g2);color:var(--g)}
.seg{display:flex;background:#efeee9;border-radius:10px;padding:3px}
.seg button{flex:1;text-align:center;font-size:13.5px;padding:8px;border-radius:8px;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.row2{display:flex;gap:10px;align-items:center}
.sw{display:flex;align-items:center;justify-content:space-between;padding:4px 0;font-size:14.5px}
.tg{width:50px;height:30px;border-radius:15px;background:#d9ddd9;position:relative;flex-shrink:0;transition:.15s}
.tg:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.15s}
.tg.on{background:var(--g)}.tg.on:after{left:23px}
.link{color:var(--mute);font-size:13px;text-decoration:underline;display:block;margin:12px auto 0}
/* login */
#login{max-width:400px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 90px) 24px 40px}
#login .logo{width:72px;height:72px;border-radius:18px;margin-bottom:18px}
#login h1{font-size:26px;margin-bottom:6px}
#login p{color:var(--mute);font-size:14px;margin-bottom:24px}
#login .err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 34px);transform:translateX(-50%) translateY(-20px);background:#1f2a24;color:#fff;font-size:13.5px;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<div id="login" hidden>
  <img class="logo" src="icon.png" alt="">
  <h1>우리집 재고</h1>
  <p>가족 계정으로 로그인하세요.</p>
  <div class="f"><label>이메일</label><input class="inp" id="l-email" type="email" autocomplete="username"></div>
  <div class="f"><label>비밀번호</label><input class="inp" id="l-pw" type="password" autocomplete="current-password"></div>
  <button class="btn" data-act="login">로그인</button>
  <div class="err" id="l-err"></div>
</div>

<main id="main" hidden></main>

<nav class="tabs" id="tabs" hidden>
  <button class="tab" data-act="tab" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>홈</button>
  <button class="tab" data-act="tab" data-v="inv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M5 9.5h14M8.5 5.5v1.5M8.5 12.5v3"/></svg>재고</button>
  <button class="tab" data-act="tab" data-v="shop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.5l2.2 11h10.6L20.5 7H6.4"/><circle cx="9.5" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg>장보기<span class="badge" id="shop-badge" hidden></span></button>
  <button class="tab" data-act="tab" data-v="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>추가</button>
</nav>

<div id="sheet-wrap" hidden><div class="dim" data-act="close"></div><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script type="module">
/* =====================================================================
   ① Firebase 설정 — Firebase 콘솔에서 복사한 값을 붙여넣으세요.
      apiKey가 "여기에"로 시작하면 '체험 모드'(이 기기에만 저장)로 동작합니다.
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCpVTAz0zGDF5n-K4oWIz5UPEqobTC8KU8",
  authDomain: "our-home-stock-b3d79.firebaseapp.com",
  projectId: "our-home-stock-b3d79",
  storageBucket: "our-home-stock-b3d79.firebasestorage.app",
  messagingSenderId: "318725960121",
  appId: "1:318725960121:web:87af280d4c60cdb3d84668"
};
const HOME_ID = "our-home";   // 우리집 데이터 이름 (바꿀 필요 없음)
const DEMO = !FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.startsWith("여기");

/* ---------- 기본 설정 ---------- */
const LOCS = ["냉장실","냉동실","팬트리","욕실","세탁실","주방 수납장"];
const LEVELS = {many:"많음", some:"조금", none:"없음"};
const P = (name,loc,mode,days,extra={}) => ({name,loc,mode,track:days!=null,days:days??null,...extra});
const PRESETS = [
  P("우유","냉장실","count",7), P("계란","냉장실","count",14), P("두부","냉장실","count",5), P("대파","냉장실","count",7),
  P("시금치","냉장실","count",4), P("요거트","냉장실","count",10), P("콩나물","냉장실","count",3), P("김치","냉장실","level",null),
  P("냉동만두","냉동실","count",180), P("양파","팬트리","count",21), P("라면","팬트리","count",null,{minQty:1}), P("쌀","팬트리","level",null,{threshold:"some"}),
  P("휴지","욕실","count",null,{minQty:1}), P("치약","욕실","count",null), P("세제","세탁실","level",null,{threshold:"some"}), P("주방세제","주방 수납장","level",null,{threshold:"some"}),
];

/* ---------- 상태 ---------- */
const state = {items:{}, shopping:{}, logs:[], tab:"home", loc:"냉장실", q:"", expanded:new Set(), error:""};
let me = lsGet("stock-me") || (DEMO ? "나" : "");
let sheetCtx = null;

/* ---------- 유틸 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const clone = o => JSON.parse(JSON.stringify(o));
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function today(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function ymd(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function addDays(n){ const d=today(); d.setDate(d.getDate()+Number(n)); return ymd(d); }
function dday(exp){ const [y,m,d]=exp.split("-").map(Number); return Math.round((new Date(y,m-1,d)-today())/864e5); }
function md(exp){ const [,m,d]=exp.split("-").map(Number); return `${m}/${d}`; }
function ddLabel(n){ return n<0 ? `${-n}일 지남` : n===0 ? "오늘까지" : `D-${n}`; }
function ddCls(n){ return n<0 ? "r" : n<=3 ? "o" : "g"; }
function ago(t){ const s=(Date.now()-t)/1000; if(s<60) return "방금"; if(s<3600) return `${Math.floor(s/60)}분 전`; if(s<86400) return `${Math.floor(s/3600)}시간 전`; if(s<172800) return "어제"; return `${Math.floor(s/86400)}일 전`; }
function sortB(bs){ return (bs||[]).slice().sort((a,b)=>(a.exp||"9999").localeCompare(b.exp||"9999")); }
function total(it){ return (it.batches||[]).reduce((s,b)=>s+b.qty,0); }
function needsBuy(it){
  if(it.auto===false) return false;
  if(it.mode==="level") return it.threshold==="some" ? it.level!=="many" : it.level==="none";
  return total(it) <= (it.minQty||0);
}
const items = () => Object.values(state.items);
const byName = n => items().find(i=>i.name===n.trim());
function newItem(base={}){
  return {id:uid(), name:"", loc:state.loc||"냉장실", mode:"count", track:true, days:7, batches:[], level:"many", minQty:0, threshold:"none", auto:true, ...clone(base), };
}
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2200); }

/* =====================================================================
   저장소: 체험 모드(localStorage) / Firebase(Firestore 실시간 공유)
   ===================================================================== */
let backend;

const LocalBackend = {
  async init(){
    const raw = lsGet("stock-demo");
    if(raw){ const d=JSON.parse(raw); state.items=d.items||{}; state.shopping=d.shopping||{}; state.logs=d.logs||[]; }
    else seedDemo();
    showApp(); render();
  },
  save(){ lsSet("stock-demo", JSON.stringify({items:state.items, shopping:state.shopping, logs:state.logs})); },
  async putItem(it){ state.items[it.id]=it; this.save(); render(); },
  async delItem(id){ delete state.items[id]; this.save(); render(); },
  async putShop(s){ state.shopping[s.id]=s; this.save(); render(); },
  async delShop(id){ delete state.shopping[id]; this.save(); render(); },
  async addLog(text){ state.logs.unshift({id:uid(), text, who:me||"나", at:Date.now()}); state.logs=state.logs.slice(0,30); this.save(); render(); },
  async logout(){},
};

function seedDemo(){
  const mk=(o)=>{ const it=newItem(o); state.items[it.id]=it; };
  mk({name:"우유",loc:"냉장실",days:7,batches:[{exp:addDays(2),qty:1},{exp:addDays(7),qty:2},{exp:addDays(11),qty:1}]});
  mk({name:"계란",loc:"냉장실",days:14,batches:[{exp:addDays(3),qty:6}]});
  mk({name:"두부",loc:"냉장실",days:5,batches:[{exp:addDays(-1),qty:1}]});
  mk({name:"시금치",loc:"냉장실",days:4,batches:[{exp:addDays(3),qty:1}]});
  mk({name:"요거트",loc:"냉장실",days:10,batches:[{exp:addDays(9),qty:4}]});
  mk({name:"대파",loc:"냉장실",days:7,batches:[]});
  mk({name:"김치",loc:"냉장실",mode:"level",track:false,days:null,level:"some"});
  mk({name:"고추장",loc:"냉장실",mode:"level",track:false,days:null,level:"many"});
  mk({name:"냉동만두",loc:"냉동실",days:180,batches:[{exp:addDays(120),qty:2}]});
  mk({name:"라면",loc:"팬트리",track:false,days:null,minQty:1,batches:[{exp:null,qty:5}]});
  mk({name:"쌀",loc:"팬트리",mode:"level",track:false,days:null,level:"many",threshold:"some"});
  mk({name:"휴지",loc:"욕실",track:false,days:null,minQty:1,batches:[]});
  mk({name:"샴푸",loc:"욕실",mode:"level",track:false,days:null,level:"many",threshold:"some"});
  mk({name:"세제",loc:"세탁실",mode:"level",track:false,days:null,level:"some",threshold:"some"});
  mk({name:"키친타월",loc:"주방 수납장",track:false,days:null,batches:[{exp:null,qty:2}]});
  const s={id:uid(),name:"사과",at:Date.now()}; state.shopping[s.id]=s;
  state.logs=[{id:uid(),text:"우유 +2 (~"+md(addDays(7))+")",who:"가족",at:Date.now()-2*3600e3},{id:uid(),text:"대파 −1",who:"나",at:Date.now()-26*3600e3}];
}

async function FirebaseBackend(){
  const V="10.12.2", base=`https://www.gstatic.com/firebasejs/${V}/`;
  const [{initializeApp}, A, F] = await Promise.all([
    import(base+"firebase-app.js"), import(base+"firebase-auth.js"), import(base+"firebase-firestore.js")]);
  const app = initializeApp(FIREBASE_CONFIG);
  const auth = A.getAuth(app);
  let db;
  try{ db = F.initializeFirestore(app,{ignoreUndefinedProperties:true, localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})}); }
  catch(e){ db = F.getFirestore(app); }
  const col = n => F.collection(db,"homes",HOME_ID,n);
  const strip = o => { const c={...o}; delete c.id; return c; };
  let unsubs=[];
  const onErr = e => { state.error = e.code==="permission-denied" ? "이 계정은 우리집 데이터에 접근할 권한이 없어요. Firebase 보안 규칙에 이메일이 등록됐는지 확인해 주세요." : "데이터를 불러오지 못했어요: "+e.message; render(); };
  function subscribe(){
    unsubs.push(F.onSnapshot(col("items"), s=>{ const o={}; s.forEach(d=>o[d.id]={id:d.id,...d.data()}); state.items=o; state.error=""; render(); }, onErr));
    unsubs.push(F.onSnapshot(col("shopping"), s=>{ const o={}; s.forEach(d=>o[d.id]={id:d.id,...d.data()}); state.shopping=o; render(); }, onErr));
    unsubs.push(F.onSnapshot(F.query(col("logs"),F.orderBy("at","desc"),F.limit(20)), s=>{ state.logs=s.docs.map(d=>({id:d.id,...d.data()})); render(); }, onErr));
  }
  A.onAuthStateChanged(auth, user=>{
    unsubs.forEach(u=>u()); unsubs=[];
    if(!user){ showLogin(); return; }
    showApp(); subscribe(); render();
    if(!me) openNick(true);
  });
  return {
    async login(email,pw){ await A.signInWithEmailAndPassword(auth,email,pw); },
    async logout(){ await A.signOut(auth); },
    putItem: it => F.setDoc(F.doc(col("items"),it.id), strip(it)),
    delItem: id => F.deleteDoc(F.doc(col("items"),id)),
    putShop: s => F.setDoc(F.doc(col("shopping"),s.id), strip(s)),
    delShop: id => F.deleteDoc(F.doc(col("shopping"),id)),
    addLog: text => F.addDoc(col("logs"),{text, who:me||"가족", at:Date.now()}),
  };
}

/* ---------- 데이터 변경 ---------- */
async function saveItem(it, logText){
  const prev = state.items[it.id];
  const wasNeed = prev ? needsBuy(prev) : false;
  it.batches = sortB((it.batches||[]).filter(b=>b.qty>0));
  it.updatedAt = Date.now();
  const nowNeed = needsBuy(it);
  try{
    const p1 = backend.putItem(clone(it));
    const p2 = logText ? backend.addLog(logText) : null;
    if(!wasNeed && nowNeed && prev) toast(`${it.name}: 장보기 목록에 추가됐어요`);
    await Promise.all([p1,p2]);
  }catch(e){ toast("저장 실패: "+e.message); }
}
function decItem(it, exp){
  const c=clone(it); const bs=sortB(c.batches);
  const b = exp===undefined ? bs.find(b=>b.qty>0) : bs.find(b=>(b.exp||"")===exp);
  if(!b || b.qty<=0) return;
  b.qty--; c.batches=bs; saveItem(c, `${it.name} −1`);
}
function incBatch(it, exp){
  const c=clone(it); const b=c.batches.find(b=>(b.exp||"")===exp);
  if(b){ b.qty++; saveItem(c, `${it.name} +1`); }
}
function addBatch(c, exp, qty){
  const b=c.batches.find(b=>(b.exp||null)===(exp||null));
  if(b) b.qty+=qty; else c.batches.push({exp:exp||null, qty});
}

function vInv(){
  const counts={}; items().forEach(i=>counts[i.loc]=(counts[i.loc]||0)+1);
  return header("재고") + `
  <input class="search" id="q" type="search" placeholder="품목 검색 (예: 간장)" value="${esc(state.q)}" autocomplete="off">

  <div id="inv-list">${invList()}</div>`;
}
function invList(){
  const q=state.q.trim();
  let list = q ? items().filter(i=>i.name.includes(q)) : items().filter(i=>i.loc===state.loc);
  const key = i => { const out = i.mode==="level" ? i.level==="none" : total(i)===0; const f=sortB(i.batches).find(b=>b.exp&&b.qty>0); return [out?1:0, f?f.exp:"9999", i.name]; };
  list.sort((a,b)=>{ const x=key(a), y=key(b); return x[0]-y[0] || x[1].localeCompare(y[1]) || x[2].localeCompare(y[2],"ko"); });
  if(!list.length) return `<div class="empty-msg" style="text-align:center;padding:30px 0">${q?"검색 결과가 없어요.":"이 장소에 등록된 품목이 없어요."}<br><button class="btn ghost" style="max-width:220px;margin:12px auto 0" data-act="tab" data-v="add">품목 추가하기</button></div>`;
  return list.map(i=>invRow(i,!!q)).join("");
}
function invRow(it, showLoc){
  const t=total(it), bs=sortB(it.batches), open=state.expanded.has(it.id);
  const sub=[];
  if(showLoc) sub.push(esc(it.loc));
  if(it.mode==="level") sub.push("양으로 관리");
  else if(it.track){ const f=bs.find(b=>b.exp&&b.qty>0); if(f){ const n=dday(f.exp); sub.push(`${bs.length>1?"가장 빠른 ":"유통기한 "}${md(f.exp)} · <span class="t-${ddCls(n)}">${ddLabel(n)}</span>`); } }
  if(needsBuy(it)) sub.push(`<span class="t-g">🛒 장보기 목록에 있음</span>`);
  const multi = it.mode==="count" && bs.length>1;
  const empty = it.mode==="level" ? it.level==="none" : t===0;
  const ctrl = it.mode==="level"
    ? `<div class="lv">${Object.entries(LEVELS).map(([k,v])=>`<button class="${it.level===k?"on":""}" data-act="lv" data-id="${it.id}" data-v="${k}">${v}</button>`).join("")}</div>`
    : `<div class="step"><button data-act="dec" data-id="${it.id}" aria-label="빼기">−</button><b>${t}개</b><button data-act="inc" data-id="${it.id}" aria-label="더하기">+</button></div>`;
  let panel="";
  if(open){
    const rows = (it.mode==="count" && it.track) ? bs.map(b=>{ const n=b.exp?dday(b.exp):null;
      return `<div class="bt"><span>${b.exp?`${md(b.exp)}까지 <span class="t-${ddCls(n)}">(${ddLabel(n)})</span>`:"유통기한 없음"}</span>
        <div class="step"><button data-act="bdec" data-id="${it.id}" data-exp="${b.exp||""}">−</button><b>${b.qty}개</b><button data-act="binc" data-id="${it.id}" data-exp="${b.exp||""}">+</button></div></div>`; }).join("") : "";
    panel = `<div class="panel">${rows}<div class="links">${it.mode==="count"?`<button data-act="stock" data-id="${it.id}">＋ 새로 들여놓기</button>`:""}<button data-act="edit" data-id="${it.id}">설정 / 삭제</button></div></div>`;
  }
  return `<div class="inv ${empty?"empty":""} ${open?"open":""}">
    <button class="inv-main" data-act="toggle" data-id="${it.id}"><div class="n">${esc(it.name)}${multi?`<span class="cnt">묶음 ${bs.length} ${open?"▴":"▾"}</span>`:""}</div><div class="s">${sub.join(" · ")||"&nbsp;"}</div></button>
    ${ctrl}</div>${panel}`;
}

/* =====================================================================
   이벤트
   ===================================================================== */
const A = {
  tab: el => { state.tab=el.dataset.v; state.q=""; window.scrollTo(0,0); render(); },
  loc: el => { state.loc=el.dataset.v; state.q=""; render(); },
  toggle: el => { const id=el.dataset.id; state.expanded.has(id)?state.expanded.delete(id):state.expanded.add(id); render(); },
  goto: el => { const it=state.items[el.dataset.id]; if(!it) return; state.tab="inv"; state.loc=it.loc; state.q=""; state.expanded.add(it.id); render(); window.scrollTo(0,0); },
  dec: el => { const it=state.items[el.dataset.id]; if(it) decItem(it); },
  inc: el => { const it=state.items[el.dataset.id]; if(!it) return;
    if(it.track) openStock(it);
    else { const c=clone(it); addBatch(c,null,1); saveItem(c,`${it.name} +1`); } },
  bdec: el => { const it=state.items[el.dataset.id]; if(it) decItem(it, el.dataset.exp); },
  binc: el => { const it=state.items[el.dataset.id]; if(it) incBatch(it, el.dataset.exp); },
  lv: el => { const it=state.items[el.dataset.id]; if(!it||it.level===el.dataset.v) return; const c=clone(it); c.level=el.dataset.v; saveItem(c,`${it.name} → ${LEVELS[c.level]}`); },
  stock: el => { const it=state.items[el.dataset.id]; if(it) openStock(it); },
  edit: el => { const it=state.items[el.dataset.id]; if(it) openEdit(it); },
  buyItem: el => { const it=state.items[el.dataset.id]; if(it) openStock(it); },
  buyShop: el => { const s=state.shopping[el.dataset.id]; if(!s) return;
    const ex=byName(s.name); if(ex) return openStock(ex,{shopId:s.id});
    const p=PRESETS.find(p=>p.name===s.name.trim());
    openStock(newItem(p?{...p,batches:[]}:{name:s.name.trim()}),{shopId:s.id}); },
  sdel: el => { backend.delShop(el.dataset.id); },
  preset: el => { const p=PRESETS[+el.dataset.i]; const ex=byName(p.name); openStock(ex || newItem({...p,batches:[]})); },
  create: () => openEdit(newItem({name:"",loc:state.loc}), true),
  sys: () => openNick(false),
  close: () => closeSheet(),
  // 재고 넣기 시트
  "s-loc": el => { readExp(); sheetCtx.item.loc=el.dataset.v; sheetCtx.rerender(); },
  "s-qty": el => { readExp(); sheetCtx.qty=Math.max(1,sheetCtx.qty+Number(el.dataset.v)); sheetCtx.rerender(); },
  "s-days": el => { sheetCtx.exp=addDays(el.dataset.v); sheetCtx.rerender(); },
  "s-level": el => { sheetCtx.level=el.dataset.v; sheetCtx.rerender(); },
  "s-track": el => { readExp(); const it=sheetCtx.item; it.track=el.dataset.v==="1"; if(it.track){ it.days=it.days||7; sheetCtx.exp=addDays(it.days);} else it.days=null; sheetCtx.rerender(); },
  "s-save": async () => { readExp(); const ctx=sheetCtx, c=ctx.item; let txt;
    if(c.mode==="count"){ const exp=c.track?ctx.exp:null; addBatch(c,exp,ctx.qty);
      txt = ctx.isNew ? `${c.name} 등록 (${ctx.qty}개${exp?`, ~${md(exp)}`:""})` : `${c.name} +${ctx.qty}${exp?` (~${md(exp)})`:""}`; }
    else { c.level=ctx.level; txt = ctx.isNew ? `${c.name} 등록 (${LEVELS[c.level]})` : `${c.name} → ${LEVELS[c.level]}`; }
    closeSheet(); await saveItem(c,txt); if(ctx.shopId) backend.delShop(ctx.shopId); toast(`${c.name} 재고에 넣었어요`); },
  "s-shopdel": () => { const id=sheetCtx.shopId; closeSheet(); backend.delShop(id); },
  // 설정 시트
  "e-loc": el => { readEdit(); sheetCtx.item.loc=el.dataset.v; sheetCtx.rerender(); },
  "e-mode": el => { readEdit(); const it=sheetCtx.item; it.mode=el.dataset.v; if(it.mode==="level"){ it.track=false; } sheetCtx.rerender(); },
  "e-track": () => { readEdit(); const it=sheetCtx.item; it.track=!it.track; it.days=it.track?(it.days||7):null; sheetCtx.rerender(); },
  "e-th": el => { readEdit(); sheetCtx.item.threshold=el.dataset.v; sheetCtx.rerender(); },
  "e-auto": () => { readEdit(); sheetCtx.item.auto = sheetCtx.item.auto===false; sheetCtx.rerender(); },
  "e-save": async () => { readEdit(); const ctx=sheetCtx, it=ctx.item;
    if(!it.name){ toast("이름을 입력해 주세요"); return; }
    const dup=byName(it.name); if(dup && dup.id!==it.id){ toast("같은 이름의 품목이 이미 있어요"); return; }
    if(!it.track) it.days=null;
    if(it.mode==="level"){ it.batches=[]; }
    else if(!it.track){ const t=total(it); it.batches = t?[{exp:null,qty:t}]:[]; }
    if(ctx.create){ closeSheet(); openStock(it); return; }
    closeSheet(); await saveItem(it, `${it.name} 설정 변경`); toast("저장했어요"); },
  "e-del": async () => { const ctx=sheetCtx; if(!ctx.armed){ readEdit(); ctx.armed=true; ctx.rerender(); return; }
    const it=ctx.item; closeSheet(); state.expanded.delete(it.id); await backend.delItem(it.id); backend.addLog(`${it.name} 삭제`); toast("삭제했어요"); },
  // 이름/설정
  "n-save": () => { const v=$("#n-me").value.trim(); if(!v){ toast("이름을 입력해 주세요"); return; } me=v; lsSet("stock-me",v); closeSheet(); render(); },
  "n-reset": () => { try{ localStorage.removeItem("stock-demo"); }catch(e){} state.items={}; state.shopping={}; state.logs=[]; seedDemo(); LocalBackend.save(); closeSheet(); render(); toast("체험 데이터를 되돌렸어요"); },
  "n-logout": async () => { closeSheet(); await backend.logout(); },
  // 로그인
  login: async () => { const e=$("#l-email").value.trim(), p=$("#l-pw").value, err=$("#l-err"); err.textContent="";
    if(!e||!p){ err.textContent="이메일과 비밀번호를 입력해 주세요."; return; }
    try{ await backend.login(e,p); }
    catch(x){ err.textContent = ({"auth/invalid-credential":"이메일 또는 비밀번호가 맞지 않아요.","auth/invalid-email":"이메일 형식을 확인해 주세요.","auth/too-many-requests":"시도가 너무 많아요. 잠시 후 다시 해 주세요.","auth/network-request-failed":"인터넷 연결을 확인해 주세요."})[x.code] || ("로그인 실패: "+x.code); } },
};
document.addEventListener("click", e => {
  const el=e.target.closest("[data-act]"); if(!el) return;
  const f=A[el.dataset.act]; if(f){ e.preventDefault(); f(el); }
});
document.addEventListener("input", e => { if(e.target.id==="q"){ state.q=e.target.value; $("#inv-list").innerHTML=invList();
  document.querySelectorAll(".chips .chip[data-act=loc]").forEach(c=>c.classList.toggle("on", !state.q && c.dataset.v===state.loc)); } });
document.addEventListener("submit", e => {
  if(e.target.dataset.form==="shopadd"){ e.preventDefault(); const inp=$("#shop-in"), v=inp.value.trim(); if(!v) return;
    const ex=byName(v); if(ex && needsBuy(ex)){ toast(`${v}은(는) 이미 목록에 있어요`); inp.value=""; return; }
    backend.putShop({id:uid(), name:v, at:Date.now()}); inp.value=""; }
});
document.addEventListener("keydown", e => { if(e.key==="Enter" && (e.target.id==="l-pw"||e.target.id==="l-email")) A.login(); });
// 날짜가 바뀌면(자정이 지나면) D-day 다시 계산
document.addEventListener("visibilitychange", () => { if(!document.hidden) render(); });

/* ---------- 시작 ---------- */
(async () => {
  if(DEMO){ backend=LocalBackend; await backend.init(); }
  else {
    try{ backend = await FirebaseBackend(); }
    catch(e){ showApp(); state.error="Firebase에 연결하지 못했어요: "+e.message; render(); }
  }
})();
</script>
</body>
</html>
